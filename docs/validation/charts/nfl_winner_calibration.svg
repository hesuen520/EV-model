<svg viewBox="0 0 460 340" role="img" aria-label="nfl winner: calibration of selections (final test)" xmlns="http://www.w3.org/2000/svg" class="viz"><style>.viz{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--series:#2a78d6}@media (prefers-color-scheme: dark){.viz{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--series:#3987e5}}

