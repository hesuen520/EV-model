[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evmodel"
version = "0.2.0"
description = "Multi-sport pregame probability platform (sportspred) with a separate price/EV toolkit (evmodel)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
    "click>=8.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
dashboard = ["streamlit>=1.36"]

[project.scripts]
evmodel = "evmodel.cli:main"
sportspred = "sportspred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evmodel = ["data/*.json"]
sportspred = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
